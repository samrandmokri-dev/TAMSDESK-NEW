name: Build TAMSDESK exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish TamsDesk.Client/TamsDesk.Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamsDesk-exe
          path: out/TamsDesk.exe
          if-no-files-found: error

      - name: Publish downloadable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/TamsDesk.exe \
            --title "TAMSDESK (latest build)" \
            --notes "آخرین نسخه‌ی ساخته‌شده‌ی TamsDesk.exe. فایل را از همین‌جا دانلود کنید."
